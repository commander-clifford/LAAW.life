name: Deploy v2 preview to GitHub Pages

# The public Pages preview follows v2-dev. HostGator publication is separate.
# Keep the github-pages environment restricted to the v2-dev branch so an
# older workflow still present on main cannot replace this preview.

on:
  push:
    branches:
      - v2-dev
  pull_request:
    branches:
      - main
      - v2-dev
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.ref == 'refs/heads/v2-dev' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && 'pages' || format('quality-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test FTPS upload safeguards without a network connection
        run: python3 -B -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run quality checks
        run: npm run release:check

  pages_config:
    if: github.ref == 'refs/heads/v2-dev' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    needs: quality
    outputs:
      base_path: ${{ steps.pages.outputs.base_path }}
    permissions:
      contents: read
      pages: read
    steps:
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

  build:
    if: github.ref == 'refs/heads/v2-dev' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    needs:
      - quality
      - pages_config
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build
        env:
          PAGES_BASE_PATH: ${{ needs.pages_config.outputs.base_path }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke-test Pages artifact
        run: npm run test:e2e
        env:
          PLAYWRIGHT_BASE_PATH: ${{ needs.pages_config.outputs.base_path }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    if: github.ref == 'refs/heads/v2-dev' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
