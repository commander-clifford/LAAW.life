name: Refresh GitHub Pages calendar data

# Manual helper for v2-dev only. No schedule: GitHub schedules execute workflow
# definitions on the default branch (main), which has no refresh dispatcher.
# Until this helper is registered there, manually run deploy-pages.yml with
# ref v2-dev to rebuild the preview and its calendar data.
# This never refreshes the FTP-hosted production site.

on:
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even when calendar feeds are unchanged
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.ref == 'refs/heads/v2-dev' && 'pages' || format('calendar-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  check:
    if: github.ref == 'refs/heads/v2-dev'
    runs-on: ubuntu-latest
    outputs:
      cache_hit: ${{ steps.calendar-cache.outputs.cache-hit }}
      fingerprint: ${{ steps.fingerprint.outputs.fingerprint }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Fingerprint public calendar feeds
        id: fingerprint
        run: node scripts/calendar-feed-fingerprint.mjs

      - name: Check for an unchanged calendar snapshot
        id: calendar-cache
        uses: actions/cache/restore@v5
        with:
          path: .github/calendar-feed-cache-marker
          key: calendar-feed-${{ github.sha }}-${{ steps.fingerprint.outputs.fingerprint }}
          lookup-only: true

  build:
    if: github.ref == 'refs/heads/v2-dev' && (needs.check.outputs.cache_hit != 'true' || inputs.force)
    runs-on: ubuntu-latest
    needs: check
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm ci

      - name: Test FTPS upload safeguards without a network connection
        run: python3 -B -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Check and build refreshed Pages artifact
        run: npm run release:check
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          PLAYWRIGHT_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    if: github.ref == 'refs/heads/v2-dev'
    runs-on: ubuntu-latest
    needs:
      - check
      - build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout calendar cache marker
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github/calendar-feed-cache-marker
          sparse-checkout-cone-mode: false

      - name: Deploy refreshed GitHub Pages calendar
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Remember the deployed calendar snapshot
        if: needs.check.outputs.cache_hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .github/calendar-feed-cache-marker
          key: calendar-feed-${{ github.sha }}-${{ needs.check.outputs.fingerprint }}
