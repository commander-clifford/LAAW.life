name: Refresh FTP-hosted calendar data

# Enable only after the full site is uploaded and the exact FTPS destination
# is confirmed. This workflow transfers one JSON file, never the site itself.
on:
  schedule:
    - cron: "11,41 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Verify the existing destination or publish fresh calendar data
        type: choice
        required: true
        default: preflight
        options:
          - preflight
          - refresh

permissions:
  contents: read

concurrency:
  group: ftp-calendar-refresh
  cancel-in-progress: false

jobs:
  preflight:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.mode == 'preflight'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Verify FTPS login and public destination without writing
        run: python3 -B scripts/verify-hosted-calendar.py --from-ftp
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ vars.FTP_PORT }}
          FTP_CALENDAR_DIRECTORY: ${{ vars.FTP_CALENDAR_DIRECTORY }}
          FTP_CALENDAR_ACCOUNT_ROOT: ${{ vars.FTP_CALENDAR_ACCOUNT_ROOT }}

  refresh:
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_dispatch' && inputs.mode == 'refresh') ||
      (github.event_name == 'schedule' && vars.FTP_CALENDAR_REFRESH_ENABLED == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: npm ci

      - name: Check application and calendar logic
        run: npm run check

      - name: Test FTPS upload safeguards without a network connection
        run: python3 -B -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Generate complete public calendar data
        run: npm run calendar:generate

      - name: Upload current agenda over verified FTPS
        run: python3 -B scripts/upload-calendar-agenda.py
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ vars.FTP_PORT }}
          FTP_CALENDAR_DIRECTORY: ${{ vars.FTP_CALENDAR_DIRECTORY }}
          FTP_CALENDAR_ACCOUNT_ROOT: ${{ vars.FTP_CALENDAR_ACCOUNT_ROOT }}

      - name: Verify both refreshed agendas through the public website
        run: python3 -B scripts/verify-hosted-calendar.py

      - name: Report refresh failure and recovery
        if: failure()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'REPORT'
          ## Calendar refresh failed

          Review the failed step above. A generation or transfer failure leaves the prior published agenda in place. A public-verification failure means the upload may have completed, but visitors receiving the new data has not been confirmed.

          Check the public calendar URL and the configured FTPS destination. After correcting the cause, rerun this workflow with mode `refresh`. Set `FTP_CALENDAR_REFRESH_ENABLED` to `false` to pause scheduled uploads.
          REPORT
