name: Refresh FTP-hosted calendar data

# Enable only after the full site is uploaded and the exact FTPS destination
# is confirmed. This workflow transfers one JSON file, never the site itself.
on:
  schedule:
    - cron: "11,26,41,56 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ftp-calendar-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main' && vars.FTP_CALENDAR_REFRESH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: npm ci

      - name: Check application and calendar logic
        run: npm run check

      - name: Test FTPS upload safeguards without a network connection
        run: python3 -B -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Generate complete public calendar data
        run: npm run calendar:generate

      - name: Upload current agenda over verified FTPS
        run: python3 -B scripts/upload-calendar-agenda.py
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ vars.FTP_PORT }}
          FTP_CALENDAR_DIRECTORY: ${{ vars.FTP_CALENDAR_DIRECTORY }}
